name: Firmware Build

# Push/PR auf main: immer Firmware + Web-Flasher-Pakete bauen.
# Release: nur wenn sich FIRMWARE_APP_VERSION in include/firmware_version.h aendert
# (oder manuell per workflow_dispatch mit create_release=true).
#
# Zwei Artefakte:
#   webflasher-update        - ohne Dateisystem (normales Update)
#   webflasher-full-install  - inkl. fatfs.bin (Komplett-Installation)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      create_release:
        description: 'GitHub-Release aus aktueller FIRMWARE_APP_VERSION erzeugen'
        type: boolean
        default: false

concurrency:
  group: firmware-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Firmware + IMGs bauen
    runs-on: windows-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      create_release: ${{ steps.ver.outputs.create_release }}
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Python einrichten
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: PlatformIO-Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/.cache
            ~/.platformio/packages
            ~/.platformio/platforms
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            pio-${{ runner.os }}-

      - name: PlatformIO installieren
        run: pip install -U platformio

      - name: Firmware bauen und Web-Flasher-Pakete erzeugen
        shell: pwsh
        run: .\build.ps1 -SkipUpload

      - name: Version und Release-Bedingung ermitteln
        id: ver
        shell: pwsh
        run: |
          $verFile = 'include/firmware_version.h'
          $content = Get-Content -LiteralPath $verFile -Raw -Encoding UTF8
          $m = [regex]::Match($content, 'FIRMWARE_APP_VERSION\s+"([^"]+)"')
          if (-not $m.Success) { throw 'FIRMWARE_APP_VERSION nicht gefunden' }
          $version = $m.Groups[1].Value
          Write-Host "Aktuelle Version: $version"

          $createRelease = 'false'
          if ('${{ github.event_name }}' -eq 'workflow_dispatch' -and '${{ inputs.create_release }}' -eq 'true') {
            $createRelease = 'true'
            Write-Host 'Release: manuell angefordert (workflow_dispatch)'
          }
          elseif ('${{ github.event_name }}' -eq 'push' -and '${{ github.ref }}' -eq 'refs/heads/main') {
            $prev = ''
            try {
              $prev = git show 'HEAD^:include/firmware_version.h' 2>$null
            } catch { }
            if ($prev) {
              $pm = [regex]::Match($prev, 'FIRMWARE_APP_VERSION\s+"([^"]+)"')
              $prevVer = if ($pm.Success) { $pm.Groups[1].Value } else { '' }
              Write-Host "Vorherige Version: $prevVer"
              if ($prevVer -ne '' -and $prevVer -ne $version) {
                $createRelease = 'true'
                Write-Host "Release: Versionswechsel $prevVer -> $version"
              } else {
                Write-Host 'Release: nein (Version unveraendert)'
              }
            } else {
              Write-Host 'Release: nein (kein Vorgaenger-Commit fuer Versionsvergleich)'
            }
          }

          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "create_release=$createRelease" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Artefakt Update (ohne Dateisystem)
        uses: actions/upload-artifact@v4
        with:
          name: webflasher-update
          path: IMGs/update/
          if-no-files-found: error

      - name: Artefakt Komplett-Installation (inkl. Dateisystem)
        uses: actions/upload-artifact@v4
        with:
          name: webflasher-full-install
          path: IMGs/full-install/
          if-no-files-found: error

  release:
    name: GitHub-Release veroeffentlichen
    needs: build
    if: needs.build.outputs.create_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Update-Paket herunterladen
        uses: actions/download-artifact@v4
        with:
          name: webflasher-update
          path: release/update

      - name: Full-Install-Paket herunterladen
        uses: actions/download-artifact@v4
        with:
          name: webflasher-full-install
          path: release/full-install

      - name: ZIP-Archive fuer Release bauen
        shell: bash
        run: |
          VER="${{ needs.build.outputs.version }}"
          cd release
          zip -r "Rotor_Display_5-${VER}-update.zip" update
          zip -r "Rotor_Display_5-${VER}-full-install.zip" full-install
          ls -la

      - name: Release erstellen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.build.outputs.version }}
          name: Rotor Display ${{ needs.build.outputs.version }}
          generate_release_notes: true
          files: |
            release/Rotor_Display_5-${{ needs.build.outputs.version }}-update.zip
            release/Rotor_Display_5-${{ needs.build.outputs.version }}-full-install.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
